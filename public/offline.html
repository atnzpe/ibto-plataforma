<!doctype html>
<!--
  PÁGINA "SEM INTERNET" DA PLATAFORMA (#74, offline).
  O service worker (sw.js) mostra esta página quando a pessoa tenta abrir uma tela
  sem internet e a tela não está guardada no aparelho. Tudo aqui é embutido (sem
  arquivos de fora), porque sem internet nada mais pode ser baixado.
-->
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta name="robots" content="noindex" />
        <meta name="theme-color" content="#0a0a0a" />
        <title>Sem internet · IBTO</title>
        <style>
            /* Cores da marca (preto equilibrado e dourado), com margens de segurança (notch). */
            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #14161a;
                color: #f3f1ec;
                font-family: system-ui, sans-serif;
                padding: max(16px, env(safe-area-inset-top))
                    max(16px, env(safe-area-inset-right))
                    max(16px, env(safe-area-inset-bottom))
                    max(16px, env(safe-area-inset-left));
                box-sizing: border-box;
            }
            main {
                max-width: 28rem;
                text-align: center;
            }
            h1 {
                color: #c9bd94;
                font-size: 1.5rem;
            }
            /* Botão grande (44 px), bom para o dedo, com foco visível para quem usa teclado. */
            button {
                min-height: 44px;
                padding: 0 1.25rem;
                border-radius: 0.5rem;
                border: 1px solid #c9bd94;
                background: transparent;
                color: #f3f1ec;
                font-size: 1rem;
                cursor: pointer;
            }
            button:focus-visible {
                outline: 3px solid #c9bd94;
                outline-offset: 3px;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Você está sem internet</h1>
            <p>
                Esta tela ainda não foi guardada no seu aparelho. As telas do
                catálogo que você já abriu continuam disponíveis.
            </p>
            <p>Assim que a conexão voltar, toque em "Tentar de novo".</p>
            <!-- Recarrega a página: com internet, abre a tela que a pessoa queria. -->
            <button type="button" onclick="location.reload()">
                Tentar de novo
            </button>
        </main>
    </body>
</html>
