# CI da plataforma: a cada push e PR roda lint, tipos, testes e build.
# Usa o mesmo PHP (8.3) e o mesmo banco (Percona Server 5.7.44) da HostGator,
# para que uma migration ou um recurso de linguagem incompatível falhe aqui,
# e não no servidor.
name: CI

on:
  # Na main quem chama a CI é o deploy (deploy-homologacao.yml), antes de
  # publicar; assim ela não roda duas vezes no mesmo commit.
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CHANGELOG obrigatório (#75): PR que mexe no código (app, rotas, telas, banco,
  # configuração) precisa de uma linha no CHANGELOG.md, senão é recusada. Só nas
  # PRs; PR só de documentação ou de testes passa sem a linha.
  changelog:
    name: CHANGELOG atualizado
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Baixar o código (com o histórico, para comparar com a base da PR)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Conferir a linha no CHANGELOG
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          CABECA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Arquivos mudados na PR (da base até a ponta).
          mudados=$(git diff --name-only "$BASE" "$CABECA")
          echo "$mudados"
          # Mexeu em código? (app, rotas, telas, banco, configuração ou workflows)
          if echo "$mudados" | grep -qE '^(app|routes|resources|database|config|bootstrap|\.github)/'; then
            # Sem o CHANGELOG.md na lista: recusa, explicando o que fazer.
            if ! echo "$mudados" | grep -qx 'CHANGELOG.md'; then
              echo "::error::Esta PR mexe no código, mas não tem linha no CHANGELOG.md. Acrescente em '## [Não lançado]' o que mudou (regra da #75)."
              exit 1
            fi
          fi
          echo "CHANGELOG em dia."

  ci:
    name: Lint, testes e build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      banco:
        image: percona/percona-server:5.7.44
        env:
          MYSQL_ROOT_PASSWORD: senha-so-da-ci
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psenha-so-da-ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: senha-so-da-ci

    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar o PHP 8.3 (o da HostGator)
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Instalar o Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Dependências do PHP (exatamente as do composer.lock)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Preparar o .env de teste
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migrations no Percona 5.7 (mesmo banco da HostGator)
        run: php artisan migrate --force

      - name: Dependências do front (exatamente as do bun.lock)
        run: bun install --frozen-lockfile

      # O build também gera as rotas tipadas (Wayfinder) de que o tsc precisa.
      - name: Build de produção
        run: bun run build

      - name: Lint e formatação do front
        run: bun run check

      - name: Tipos do front
        run: bun run types:check

      - name: Testes do front
        run: bun run test

      - name: Formatação do PHP (Pint)
        run: vendor/bin/pint --test --parallel

      - name: Análise do PHP (PHPStan)
        run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress

      - name: Testes do PHP (Pest, no Percona 5.7)
        run: php artisan test
