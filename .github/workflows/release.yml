# RELEASE AUTOMÁTICA (#75): ao criar uma tag vX.Y.Z (ex.: v0.2.0), o GitHub:
#   1. roda a CI inteira (o mesmo PHP e o mesmo banco da HostGator);
#   2. monta o pacote pronto para a HostGator (código, front compilado em
#      public/build e as bibliotecas de produção), SEM .env;
#   3. calcula o hash SHA-256 (a "impressão digital" que prova que o arquivo
#      baixado é exatamente o publicado);
#   4. publica a Release com as notas daquela versão tiradas do CHANGELOG.md.
# A produção (#56) só recebe versões com tag; voltar atrás = publicar a tag anterior.
# Como criar: git tag v0.2.0 && git push origin v0.2.0 (o VERSION precisa dizer 0.2.0).
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Montar e publicar a release
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # Para criar a Release e anexar os arquivos.
      contents: write
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A tag e o arquivo VERSION precisam bater (evita publicar "v0.3.0" com o rodapé dizendo 0.2.0).
      - name: Conferir a tag com o VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          versao="$(tr -d '[:space:]' < VERSION)"
          echo "Tag: $tag | VERSION: $versao"
          if [ "$tag" != "$versao" ]; then
            echo "::error::A tag v$tag não bate com o VERSION ($versao). Ajuste o VERSION antes de criar a tag."
            exit 1
          fi

      - name: Instalar o PHP 8.3 (o da HostGator)
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Instalar o Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # O build do front chama o artisan (rotas do Wayfinder): precisa de um .env provisório, apagado logo depois.
      - name: Compilar o front
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          cp .env.example .env
          php artisan key:generate
          bun install --frozen-lockfile
          bun run build
          rm .env

      - name: Dependências do PHP só de produção
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist

      # O mesmo conteúdo do deploy: só o que roda no servidor, nunca .env, logs ou caches.
      - name: Montar o pacote
        run: |
          mkdir pacote
          cp -r app bootstrap config database deploy lang public resources routes vendor artisan composer.json VERSION pacote/
          rm -rf pacote/resources/js pacote/resources/css
          git ls-files storage | xargs -I{} cp --parents {} pacote/
          echo "$GITHUB_SHA" > pacote/VERSAO_DEPLOY
          nome="ibto-plataforma-${GITHUB_REF_NAME}.zip"
          (cd pacote && zip -rq "../$nome" .)
          sha256sum "$nome" > "$nome.sha256"
          cat "$nome.sha256"

      # As notas: o trecho do CHANGELOG entre "## [X.Y.Z]" e a próxima versão.
      - name: Tirar as notas do CHANGELOG
        run: |
          versao="${GITHUB_REF_NAME#v}"
          awk -v v="$versao" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notas.md
          # Sem trecho para a versão: avisa nas notas em vez de publicar vazio.
          [ -s notas.md ] || echo "Veja o CHANGELOG.md desta versão." > notas.md
          cat notas.md

      - name: Publicar a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notas.md \
            "ibto-plataforma-${GITHUB_REF_NAME}.zip" \
            "ibto-plataforma-${GITHUB_REF_NAME}.zip.sha256"
