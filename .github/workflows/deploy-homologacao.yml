# Deploy automático da homologação da plataforma (cursos-homolog.ib-to.org),
# issue #35. O plano P da HostGator não tem SSH nem Node, então:
#   1. a CI roda inteira (mesmos PHP e banco do servidor);
#   2. o pacote é montado aqui: front já compilado em public/build, o commit
#      gravado em VERSAO_DEPLOY e as bibliotecas do PHP (vendor, sem as de
#      desenvolvimento) num único vendor.zip, com a "versão" delas em
#      VENDOR_VERSAO;
#   3. o pacote vai por FTPS para a pasta do projeto (o subdomínio aponta só
#      para a subpasta public/, então .env, vendor e o código ficam fora da web).
#      O vendor vai zipado porque, solto, são ~8.300 arquivos e a HostGator
#      derrubou a conexão depois de 44 minutos (05/10/2026);
#   4. no servidor, o Cron Job roda, nesta ordem: deploy/atualizar-vendor.php
#      (descompacta o vendor.zip quando VENDOR_VERSAO muda), o
#      plataforma:pos-deploy (migrations e caches) e o agendador (fila).
# Passo a passo para a equipe: docs/publicacao-homologacao.md.
name: Deploy homologação

on:
  push:
    branches: [main]
  # Actions → "Deploy homologação" → Run workflow → escolher a branch a testar.
  workflow_dispatch:

permissions:
  contents: read

# Um deploy por vez, e nunca cancelar um envio pela metade.
concurrency:
  group: deploy-homologacao
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  pacote:
    name: Montar o pacote
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar o PHP 8.3 (o da HostGator)
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Instalar o Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # O build do front chama o artisan (rotas tipadas do Wayfinder), então
      # precisa do Composer e de um .env provisório, apagado logo depois.
      - name: Compilar o front
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          cp .env.example .env
          php artisan key:generate
          bun install --frozen-lockfile
          bun run build
          rm .env

      # Reinstala só as bibliotecas de produção (sem Pest, PHPStan etc.).
      # Sem "--optimize-autoloader" de propósito (e com optimize-autoloader
      # false no composer.json): o vendor.zip só é descompactado quando as
      # bibliotecas mudam, então ele não pode guardar um mapa das classes do
      # nosso app/, que mudam a cada commit. As nossas classes são achadas
      # pela regra de pastas (PSR-4), que nunca fica desatualizada.
      - name: Dependências do PHP só de produção
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist

      # Só o que roda no servidor. Do storage/ vão só as pastas vazias
      # (arquivos versionados), nunca logs, sessões ou caches gerados aqui.
      - name: Montar o pacote
        run: |
          # Cria a pasta do pacote e copia o código, SEM a pasta vendor (ela vai zipada).
          # "lang" = as mensagens do servidor em português (login, validação, e-mails; 14/10/2026).
          mkdir pacote
          # VERSION = a versão da plataforma (#75), mostrada no rodapé e em /api/saude.
          cp -r app bootstrap config database deploy lang public resources routes artisan composer.json VERSION pacote/
          # O CSS e o JS de origem não vão: o navegador usa só o public/build compilado.
          rm -rf pacote/resources/js pacote/resources/css
          # Copia só os arquivos do storage/ que estão no Git (os .gitignore das pastas vazias).
          git ls-files storage | xargs -I{} cp --parents {} pacote/
          # Grava qual commit está sendo publicado (o plataforma:pos-deploy lê este arquivo).
          echo "$GITHUB_SHA" > pacote/VERSAO_DEPLOY
          # Zipa o CONTEÚDO do vendor (o zip começa em autoload.php, não em vendor/).
          # -r entra nas subpastas; -q não lista os 8.300 arquivos no log.
          (cd vendor && zip -rq ../pacote/vendor.zip .)
          # "Versão" das bibliotecas: uma impressão digital (hash sha256) do
          # composer.lock + composer.json. Só muda quando as bibliotecas mudam;
          # é ela que o servidor compara para saber se precisa descompactar.
          cat composer.lock composer.json | sha256sum | cut -d' ' -f1 > pacote/VENDOR_VERSAO

      - name: Conferir o pacote (sem segredos, com o necessário)
        run: |
          test ! -e pacote/.env || { echo "pacote/.env não pode ser publicado"; exit 1; }
          test ! -e pacote/public/hot || { echo "public/hot não pode ser publicado"; exit 1; }
          # Cada arquivo da lista precisa existir; se faltar um, o deploy para aqui.
          for f in public/.htaccess public/index.php public/build/manifest.json artisan VERSAO_DEPLOY vendor.zip VENDOR_VERSAO deploy/atualizar-vendor.php lang/pt_BR/validation.php lang/pt_BR.json; do
            test -f "pacote/$f" || { echo "Falta pacote/$f"; exit 1; }
          done
          # A pasta vendor solta não pode ir (são os 8.300 arquivos que derrubavam o FTP).
          test ! -e pacote/vendor || { echo "pacote/vendor não pode ir solto; ele vai em vendor.zip"; exit 1; }
          # Lista o que tem dentro do zip, sem descompactar, para conferir duas coisas:
          unzip -l pacote/vendor.zip > lista-vendor.txt
          # 1) o autoload.php está na raiz do zip (senão o servidor monta o vendor errado);
          grep -qE ' autoload\.php$' lista-vendor.txt || { echo "vendor.zip sem autoload.php na raiz"; exit 1; }
          # 2) nada de dependências de desenvolvimento (o Pest é a mais fácil de achar).
          ! grep -q ' pestphp/' lista-vendor.txt || { echo "Dependências de desenvolvimento no vendor.zip"; exit 1; }

      # include-hidden-files: sem ele o public/.htaccess (senha, HTTPS) e as
      # pastas do storage ficariam de fora sem aviso.
      - name: Guardar o pacote
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pacote
          path: pacote/
          include-hidden-files: true
          retention-days: 3

  deploy:
    name: Enviar para cursos-homolog.ib-to.org
    needs: pacote
    runs-on: ubuntu-24.04
    # Com o vendor num zip só, o envio leva poucos minutos (o zip, ~20 MB,
    # vai em todo deploy porque muda um pouco a cada commit). 20 minutos
    # sobram e evitam um job preso por uma hora se a conexão travar.
    timeout-minutes: 20
    # Os segredos do FTP ficam só neste ambiente, longe dos jobs que rodam
    # código de dependências.
    environment:
      name: homologacao
      url: https://cursos-homolog.ib-to.org
    steps:
      - name: Pegar o pacote
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pacote
          path: pacote/

      # Envia só o que mudou. O .env e tudo o que o servidor cria (logs,
      # sessões, caches) nunca são enviados nem apagados.
      # vendor/** e storage/app/vendor-aplicado: quem cuida deles no servidor é
      # o deploy/atualizar-vendor.php. A lista "exclude" também vale para o que
      # já está no servidor (conferido no código da action v4.4.0), então o
      # FTP nunca apaga a pasta vendor de lá, mesmo ela não estando no pacote.
      # Placa "em atualização" (16/10/2026): entre a chegada do código novo e o Cron
      # rodar as migrations (até 5 minutos), o código novo podia procurar uma coluna
      # que ainda não existe e dar erro 500 (aconteceu às 15:48 de 16/10). Com a
      # placa (o mesmo arquivo do "php artisan down"), quem abre a página nesse
      # intervalo vê "em atualização" (503). O plataforma:pos-deploy tira a placa
      # quando termina; a palavra deploy-homologacao marca que foi o deploy que pôs.
      - name: Pôr a placa "em atualização"
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          printf '%s' '{"except":[],"redirect":null,"retry":60,"refresh":60,"secret":null,"status":503,"template":null,"motivo":"deploy-homologacao"}' > placa-down
          curl --fail --silent --show-error --ssl-reqd \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            -T placa-down \
            "ftp://$FTP_SERVER/storage/framework/down"
          echo "Placa posta: a plataforma mostra 'em atualização' até o Cron aplicar a versão."

      - name: Enviar por FTPS
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: strict
          local-dir: pacote/
          server-dir: ./
          exclude: |
            .env
            storage/logs/*.log
            storage/app/versao-aplicada
            vendor/**
            storage/app/vendor-aplicado
            # Arquivos enviados pelas pessoas na plataforma (ex.: imagem de cada
            # área de atuação, #37): só existem no servidor, o deploy nunca mexe.
            storage/app/public/**
            # Arquivos PRIVADOS enviados pelas pessoas (apostilas, vídeos, comprovantes e
            # fotos de perfil, #78): também só existem no servidor; o deploy nunca mexe.
            storage/app/private/**
            # A placa "em atualização" (posta no passo anterior; quem tira é o Cron).
            storage/framework/down
            # VERSAO_DEPLOY vai no passo seguinte, POR ÚLTIMO (ver o comentário lá).
            VERSAO_DEPLOY

      # O VERSAO_DEPLOY é o "sinal verde" para o Cron aplicar a versão nova
      # (migrations e caches). Se ele chegasse antes dos outros arquivos, o Cron
      # podia rodar no meio do envio e guardar a configuração ANTIGA no cache:
      # foi o que aconteceu em 07/10/2026 (erro 500, admin_emails = null). Por
      # isso ele só é enviado depois que todo o resto chegou. curl manda um
      # arquivo só por FTPS (--ssl-reqd = conexão sempre criptografada).
      - name: Enviar VERSAO_DEPLOY por último
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          curl --fail --silent --show-error --ssl-reqd \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            -T pacote/VERSAO_DEPLOY \
            "ftp://$FTP_SERVER/VERSAO_DEPLOY"
          echo "VERSAO_DEPLOY enviado: $(cat pacote/VERSAO_DEPLOY)"

      - name: Conferir que está no ar e protegido
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://cursos-homolog.ib-to.org/)
          echo "https://cursos-homolog.ib-to.org/ respondeu $code"
          test "$code" = "401" || { echo "Esperado 401 (senha da homologação)"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' http://cursos-homolog.ib-to.org/)
          echo "http://cursos-homolog.ib-to.org/ respondeu $code"
          test "$code" = "301" || { echo "Esperado 301 para HTTPS, sem pedir senha"; exit 1; }
