# Deploy automático da homologação da plataforma (cursos-homolog.ib-to.org),
# issue #35. O plano P da HostGator não tem SSH nem Node, então:
#   1. a CI roda inteira (mesmos PHP e banco do servidor);
#   2. o pacote é montado aqui: Composer sem dependências de desenvolvimento,
#      front já compilado em public/build e o commit gravado em VERSAO_DEPLOY;
#   3. o pacote vai por FTPS para a pasta do projeto (o subdomínio aponta só
#      para a subpasta public/, então .env, vendor e o código ficam fora da web);
#   4. no servidor, o Cron Job roda o agendador, que vê a versão nova e roda as
#      migrations e os caches (comando plataforma:pos-deploy).
# Passo a passo para a equipe: docs/publicacao-homologacao.md.
name: Deploy homologação

on:
  push:
    branches: [main]
  # Actions → "Deploy homologação" → Run workflow → escolher a branch a testar.
  workflow_dispatch:

permissions:
  contents: read

# Um deploy por vez, e nunca cancelar um envio pela metade.
concurrency:
  group: deploy-homologacao
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  pacote:
    name: Montar o pacote
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar o PHP 8.3 (o da HostGator)
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Instalar o Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # O build do front chama o artisan (rotas tipadas do Wayfinder), então
      # precisa do Composer e de um .env provisório, apagado logo depois.
      - name: Compilar o front
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          cp .env.example .env
          php artisan key:generate
          bun install --frozen-lockfile
          bun run build
          rm .env

      - name: Dependências do PHP só de produção
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress --prefer-dist

      # Só o que roda no servidor. Do storage/ vão só as pastas vazias
      # (arquivos versionados), nunca logs, sessões ou caches gerados aqui.
      - name: Montar o pacote
        run: |
          mkdir pacote
          cp -r app bootstrap config database public resources routes vendor artisan composer.json pacote/
          rm -rf pacote/resources/js pacote/resources/css
          git ls-files storage | xargs -I{} cp --parents {} pacote/
          echo "$GITHUB_SHA" > pacote/VERSAO_DEPLOY

      - name: Conferir o pacote (sem segredos, com o necessário)
        run: |
          test ! -e pacote/.env || { echo "pacote/.env não pode ser publicado"; exit 1; }
          test ! -e pacote/public/hot || { echo "public/hot não pode ser publicado"; exit 1; }
          for f in public/.htaccess public/index.php public/build/manifest.json vendor/autoload.php artisan VERSAO_DEPLOY; do
            test -f "pacote/$f" || { echo "Falta pacote/$f"; exit 1; }
          done
          test ! -d pacote/vendor/pestphp || { echo "Dependências de desenvolvimento no pacote"; exit 1; }

      # include-hidden-files: sem ele o public/.htaccess (senha, HTTPS) e as
      # pastas do storage ficariam de fora sem aviso.
      - name: Guardar o pacote
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pacote
          path: pacote/
          include-hidden-files: true
          retention-days: 3

  deploy:
    name: Enviar para cursos-homolog.ib-to.org
    needs: pacote
    runs-on: ubuntu-24.04
    # O primeiro envio leva o vendor inteiro (milhares de arquivos); os
    # seguintes mandam só o que mudou.
    timeout-minutes: 60
    # Os segredos do FTP ficam só neste ambiente, longe dos jobs que rodam
    # código de dependências.
    environment:
      name: homologacao
      url: https://cursos-homolog.ib-to.org
    steps:
      - name: Pegar o pacote
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pacote
          path: pacote/

      # Envia só o que mudou. O .env e tudo o que o servidor cria (logs,
      # sessões, caches) nunca são enviados nem apagados.
      - name: Enviar por FTPS
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: strict
          local-dir: pacote/
          server-dir: ./
          exclude: |
            .env
            storage/logs/*.log
            storage/app/versao-aplicada

      - name: Conferir que está no ar e protegido
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://cursos-homolog.ib-to.org/)
          echo "https://cursos-homolog.ib-to.org/ respondeu $code"
          test "$code" = "401" || { echo "Esperado 401 (senha da homologação)"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' http://cursos-homolog.ib-to.org/)
          echo "http://cursos-homolog.ib-to.org/ respondeu $code"
          test "$code" = "301" || { echo "Esperado 301 para HTTPS, sem pedir senha"; exit 1; }
